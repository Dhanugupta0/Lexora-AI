services:

  postgres:
    image: postgres:16-alpine
    container_name: lexora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lexora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: lexora_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexora}:${POSTGRES_PASSWORD:-lexora_secret}@postgres:5432/${POSTGRES_DB:-lexora}
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR: /uploads
      # Keep the downloaded ONNX fallback model across container restarts.
      # (Embeddings normally come from the Jina API -- JINA_API_KEY is in .env.)
      FASTEMBED_CACHE_PATH: /data/models
    volumes:
      - chroma_data:/data/chroma
      - upload_data:/uploads
      - model_cache:/data/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  upload_data:
  model_cache:
