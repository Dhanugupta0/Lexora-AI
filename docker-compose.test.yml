version: "3.9"

# ════════════════════════════════════════════════════════════════════════════════
#  LexoraAI — Test Docker Compose
#  Spins up a throwaway environment for running the test suite.
#  Usage: docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit
# ════════════════════════════════════════════════════════════════════════════════

services:

  postgres_test:
    image: postgres:16-alpine
    container_name: lexora_postgres_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lexora_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d lexora_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test_net

  chromadb_test:
    image: chromadb/chroma:0.5.3
    container_name: lexora_chromadb_test
    environment:
      - IS_PERSISTENT=FALSE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test_net

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: lexora_test_runner
    working_dir: /build
    command: >
      sh -c "pip install -e . --quiet &&
             pytest tests/ -v --cov=app --cov-report=term-missing"
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres_test:5432/lexora_test
      DATABASE_SYNC_URL: postgresql+psycopg2://test:test@postgres_test:5432/lexora_test
      CHROMA_HOST: chromadb_test
      CHROMA_PORT: "8000"
      EMBEDDING_PROVIDER: huggingface
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-key
      UPLOAD_DIR: /tmp/lexora_test_uploads
    depends_on:
      postgres_test:
        condition: service_healthy
      chromadb_test:
        condition: service_healthy
    networks:
      - test_net

networks:
  test_net:
    driver: bridge
